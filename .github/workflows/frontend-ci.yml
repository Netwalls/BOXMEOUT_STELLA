name: Frontend CI

on:
  schedule:
    # Nightly full browser matrix
    - cron: "0 3 * * *"
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Verify package-lock sync
        run: |
          npm install --package-lock-only
          git diff --exit-code package-lock.json

      - name: Install dependencies
        run: npm ci

      # ── Env contract ────────────────────────────────────────────────────────
      - name: Check .env.example matches the config schema
        run: node scripts/check-env-example.mjs

      # ── Lint ────────────────────────────────────────────────────────────────
      - name: Lint
        run: npm run lint

      # ── Type-check ──────────────────────────────────────────────────────────
      - name: Type-check
        run: npm run type-check

      # ── Unit tests ──────────────────────────────────────────────────────────
      - name: Test
        run: npm test -- --ci --coverage --passWithNoTests
        env:
          # Stub env vars so Next.js doesn't complain during test runs
          NEXT_PUBLIC_API_URL: "http://localhost:3001"
          NEXT_PUBLIC_STELLAR_NETWORK: "testnet"
          NEXT_PUBLIC_SOROBAN_RPC_URL: "https://soroban-testnet.stellar.org"
          NEXT_PUBLIC_MARKET_FACTORY_CONTRACT_ID: "CDXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: frontend/coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 7

      # ── Build ────────────────────────────────────────────────────────────────
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:3001"
          NEXT_PUBLIC_STELLAR_NETWORK: "testnet"
          NEXT_PUBLIC_SOROBAN_RPC_URL: "https://soroban-testnet.stellar.org"
          NEXT_PUBLIC_MARKET_FACTORY_CONTRACT_ID: "CDXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX"

      # ── Bundle size budget ───────────────────────────────────────────────────
      - name: Check bundle budget
        run: npm run check:bundle

      # ── Storybook build ──────────────────────────────────────────────────────
      - name: Build Storybook
        run: npm run build-storybook

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # Fail fast when package.json and package-lock.json disagree. Regenerating
      # the lock must leave it unchanged; otherwise the lock needs updating.
      - name: Verify package-lock.json is in sync
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git diff --exit-code -- package-lock.json || {
            echo "::error::package-lock.json is out of sync with package.json. Run 'npm install' in frontend/ and commit the lock."
            exit 1
          }

      - name: Install dependencies
        run: npm ci

      # Full matrix (chromium, firefox, webkit, Pixel 5, iPhone 13) on main and nightly;
      # pull requests run chromium plus one mobile project.
      - name: Determine browser matrix
        id: matrix
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "browsers=chromium" >> "$GITHUB_OUTPUT"
          else
            echo "browsers=chromium firefox webkit" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-${{ steps.matrix.outputs.browsers }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ steps.matrix.outputs.browsers }}

      # playwright.config.ts starts the mock API and an E2E build of the app
      - name: E2E tests
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            npx playwright test --project=chromium --project="Pixel 5"
          else
            npx playwright test
          fi
        env:
          NEXT_PUBLIC_STELLAR_NETWORK: "testnet"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Production build with the E2E wallet and chain mocks, served by e2e/mock-api.mjs
      - name: Build (E2E mocks)
        run: npm run build
        env:
          NEXT_PUBLIC_E2E: "true"
          NEXT_PUBLIC_API_URL: "http://localhost:3001"
          NEXT_PUBLIC_STELLAR_NETWORK: "testnet"
          NEXT_PUBLIC_ADMIN_ADDRESSES: "GE2ETESTAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAWXYZ"

      - name: Run Lighthouse CI
        run: npx lhci autorun --config=lighthouserc.json

      - name: Write Lighthouse summary
        if: always()
        run: |
          {
            echo "## Lighthouse CI"
            echo ""
            echo "Budgets are defined in frontend/lighthouserc.json."
            ls .lighthouseci 2>/dev/null | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: frontend/.lighthouseci
          if-no-files-found: ignore
          retention-days: 7
