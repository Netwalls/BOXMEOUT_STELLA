name: Backend CI

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "contracts/shared/test_snapshots/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "contracts/shared/test_snapshots/**"
      - ".github/workflows/backend-ci.yml"

defaults:
  run:
    working-directory: backend

jobs:
  build:
    name: Backend CI
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: boxmeout
          POSTGRES_PASSWORD: boxmeout
          POSTGRES_DB: boxmeout_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U boxmeout"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://boxmeout:boxmeout@localhost:5432/boxmeout_test
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Check package-lock.json is in sync with package.json
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git diff --exit-code -- package-lock.json || {
            echo "::error file=backend/package-lock.json::package-lock.json is out of sync with package.json. Run 'npm install --package-lock-only' in backend/ with npm 10 and commit the result."
            exit 1
          }

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Check Prisma schema drift
        run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url "$DATABASE_URL" --exit-code

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Check event fixtures are current
        run: npx ts-node --transpile-only scripts/export-event-fixtures.ts --check

      - name: Test
        run: npm test -- --coverage

      - name: Coverage summary
        if: always()
        run: node scripts/coverage-summary.js

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/lcov.info
          if-no-files-found: warn
