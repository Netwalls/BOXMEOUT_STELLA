name: Contracts CI

on:
  pull_request:
    paths:
      - 'contracts/**'
      - '.github/workflows/contracts-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'contracts/**'
      - '.github/workflows/contracts-ci.yml'

jobs:
  build-and-test:
    name: Build and test contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/**/Cargo.lock') }}

      - name: Build contracts
        working-directory: contracts
        run: cargo build --release --target wasm32-unknown-unknown

      - name: Run contract tests
        working-directory: contracts
        run: cargo test --release

  abi-drift:
    name: Check ABI and event-spec drift
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/**/Cargo.lock') }}

      - name: Install Stellar CLI
        run: |
          curl -fsSL https://github.com/stellar/stellar-cli/raw/main/install.sh | bash -s -- --version 22.0.1
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build contracts
        working-directory: contracts
        run: cargo build --release --target wasm32-unknown-unknown

      - name: Regenerate ABI specs
        run: |
          set -euo pipefail
          mkdir -p contracts/abi
          for wasm in contracts/target/wasm32-unknown-unknown/release/*.wasm; do
            name="$(basename "$wasm" .wasm)"
            stellar contract inspect --wasm "$wasm" --output json > "contracts/abi/${name}.json"
          done

      - name: Diff ABI specs against committed files
        id: diff
        run: |
          set -euo pipefail
          if git diff --quiet -- contracts/abi; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "ABI specs are up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff -- contracts/abi > abi.diff || true
            echo "ABI specs differ from committed files. Update contracts/abi/ in this PR."
          fi

      - name: Summarize ABI changes
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -euo pipefail
          {
            echo "## ABI / event-spec changes detected"
            echo
            echo "The generated ABI specs differ from the committed files under \`contracts/abi/\`."
            echo "If these changes are intentional, regenerate and commit the updated specs in this PR."
            echo
            echo "### Added, removed and changed functions and events"
            echo
            echo '```diff'
            git diff -- contracts/abi
            echo '```'
          } > abi-summary.md
          cat abi-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment ABI changes on PR
        if: steps.diff.outputs.changed == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('abi-summary.md', 'utf8');
            const marker = '<!-- abi-drift-check -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            const payload = `${marker}\n${body}`;
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: payload });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body: payload });
            }

      - name: Fail on ABI drift
        if: steps.diff.outputs.changed == 'true'
        run: |
          echo "::error::ABI specs are out of date. Regenerate contracts/abi/ and commit the changes."
          exit 1
