version: "3.9"

# ── BOXMEOUT local dev stack ──────────────────────────────────────────────────
# Usage:
#   cp backend/.env.example backend/.env   # fill in Stellar + DB creds
#   docker-compose up --build
#
# The API will be available at http://localhost:3001
# Swagger UI (dev mode) will be available at http://localhost:3001/docs
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: boxmeout
      POSTGRES_PASSWORD: boxmeout
      POSTGRES_DB: boxmeout
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boxmeout"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend API ─────────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://boxmeout:boxmeout@postgres:5432/boxmeout
      REDIS_URL: redis://redis:6379
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Run migrations then start server
    command: >
      sh -c "npx prisma migrate deploy && node dist/index.js"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  # ── Indexer ──────────────────────────────────────────────────────────────────
  # B-54: Runs the Soroban event-polling loop as a managed process separate
  # from the API server, sharing the same compiled Docker image.
  indexer:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: indexer
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://boxmeout:boxmeout@postgres:5432/boxmeout
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  postgres_data:
